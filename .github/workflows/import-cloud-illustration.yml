name: Import original cloud illustration (one time)
on:
  push:
    branches:
      - demo/cloud-story-cards-20260928
    paths:
      - .github/workflows/import-cloud-illustration.yml
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/cloud-story-cards-20260928
      - name: Import already-created image (no AI generation)
        env:
          IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/23dc3314-ca83-47a1-9e73-fb0b8eaa7555.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDE2YjIzZGI1OTAzODE5NCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDczMDA3NX0.Pdn2TEVJnzwtKIY09yMZHhvvSdUaqAJrxF_7CcqGQnU"
        run: |
          mkdir -p public/lab/cloud-journey
          curl --fail --location --retry 3 --silent --show-error --output public/lab/cloud-journey/cloud.png "$IMAGE_URL"
          file public/lab/cloud-journey/cloud.png
          test "$(wc -c < public/lab/cloud-journey/cloud.png)" -gt 100000
          file -b --mime-type public/lab/cloud-journey/cloud.png | grep -Fx 'image/png'
      - name: Commit permanent image asset to isolated demo branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lab/cloud-journey/cloud.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add original coastal cloud artwork for interactive demo'
            git push origin HEAD:demo/cloud-story-cards-20260928
          fi
