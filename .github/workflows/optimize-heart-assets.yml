name: Optimize Heart Cinematic Assets

on:
  workflow_dispatch:
  push:
    branches:
      - visual-engine-proof-v1
    paths:
      - .github/workflows/optimize-heart-assets.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-engine-proof-v1
          fetch-depth: 0
      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Build optimized stage and card images
        run: |
          set -euo pipefail
          for src in public/heart-cinematic/heart-??.png; do
            base="${src%.png}"
            cwebp -quiet -mt -q 86 -resize 1600 0 "$src" -o "${base}.webp"
            cwebp -quiet -mt -q 70 -resize 420 0 "$src" -o "${base}-thumb.webp"
            test "$(stat -c%s "${base}.webp")" -gt 20000
            test "$(stat -c%s "${base}-thumb.webp")" -gt 5000
          done
      - name: Commit optimized assets
        run: |
          git config user.name "nahlaty-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/heart-cinematic/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize heart cinematic assets for web"
          git push origin HEAD:visual-engine-proof-v1
