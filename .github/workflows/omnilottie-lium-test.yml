name: OmniLottie Lium Test

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Lium pod SSH host"
        required: true
        default: "146.120.227.147"
      port:
        description: "Lium pod SSH port"
        required: true
        default: "30350"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          LIUM_SSH_PRIVATE_KEY: ${{ secrets.LIUM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_B64="$(printf '%s' "$LIUM_SSH_PRIVATE_KEY" | tr -d '[:space:]')"
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/lium_key_raw
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            base64 -w 0 /tmp/lium_key_raw
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/lium_nahlaty
          chmod 600 ~/.ssh/lium_nahlaty
          ssh-keygen -y -f ~/.ssh/lium_nahlaty >/dev/null

      - name: Install and verify OmniLottie
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/lium_nahlaty -p "$PORT" root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== GPU ==="
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
          apt-get update -qq
          apt-get install -y -qq git wget >/dev/null
          if [ -x /opt/conda/bin/conda ]; then
            export PATH=/opt/conda/bin:$PATH
          elif command -v conda >/dev/null 2>&1; then
            export PATH="$(dirname "$(command -v conda)"):$PATH"
          else
            rm -rf /opt/conda
            wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p /opt/conda
            export PATH=/opt/conda/bin:$PATH
          fi
          eval "$(conda shell.bash hook)"
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          if [ ! -d /workspace/OmniLottie/.git ]; then
            git clone --depth 1 https://github.com/OpenVGLab/OmniLottie /workspace/OmniLottie
          fi
          cd /workspace/OmniLottie
          if ! conda env list | awk '{print $1}' | grep -qx omnilottie; then
            conda create -y -n omnilottie python=3.10
          fi
          conda deactivate >/dev/null 2>&1 || true
          conda env remove -y -n omnilottie >/dev/null 2>&1 || true
          conda create -y -n omnilottie python=3.10 pip
          conda activate omnilottie

          # OmniLottie upstream's tested stack: Python 3.10, torch 2.3.0,
          # torchvision 0.18.0, CUDA 12.1. Keep torch wheels isolated from
          # Conda's MKL solver to avoid iJIT_NotifyEvent ABI conflicts.
          python -m pip install -q --upgrade "pip<25"
          python -m pip install -q --no-cache-dir \
            torch==2.3.0 torchvision==0.18.0 \
            --index-url https://download.pytorch.org/whl/cu121

          python - <<'PY'
          import torch, torchvision
          print("TORCH_PRECHECK", torch.__version__)
          print("TORCHVISION_PRECHECK", torchvision.__version__)
          print("CUDA_BUILD", torch.version.cuda)
          print("CUDA_AVAILABLE", torch.cuda.is_available())
          assert torch.__version__.startswith("2.3.0")
          assert torchvision.__version__.startswith("0.18.0")
          assert torch.cuda.is_available(), "CUDA unavailable after official PyTorch wheel install"
          print("GPU", torch.cuda.get_device_name(0))
          PY

          # Install OmniLottie deps only after the GPU stack is proven.
          python -m pip install -q --no-cache-dir -r requirements.txt

          python - <<'PY'
          import torch, transformers, cv2, gradio
          print("TORCH_FINAL", torch.__version__)
          print("CUDA_FINAL", torch.cuda.is_available())
          print("TRANSFORMERS", transformers.__version__)
          print("OPENCV", cv2.__version__)
          print("GRADIO", gradio.__version__)
          assert torch.cuda.is_available()
          PY
          python inference_hf.py --help >/tmp/omnilottie-help.txt
          echo "OMNILOTTIE_INSTALL_OK"
          REMOTE
