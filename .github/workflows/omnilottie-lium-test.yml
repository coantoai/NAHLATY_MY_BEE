name: OmniLottie Lium Test

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Lium pod SSH host"
        required: true
        default: "146.120.227.147"
      port:
        description: "Lium pod SSH port"
        required: true
        default: "30350"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          LIUM_SSH_PRIVATE_KEY: ${{ secrets.LIUM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_B64="$(printf '%s' "$LIUM_SSH_PRIVATE_KEY" | tr -d '[:space:]')"
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/lium_key_raw
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            base64 -w 0 /tmp/lium_key_raw
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/lium_nahlaty
          chmod 600 ~/.ssh/lium_nahlaty
          ssh-keygen -y -f ~/.ssh/lium_nahlaty >/dev/null

      - name: Install and verify OmniLottie
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/lium_nahlaty -p "$PORT" root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== HOST GPU ==="
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
          command -v docker >/dev/null
          docker info >/dev/null

          CACHE=/workspace/omnilottie-docker
          HF_CACHE=/workspace/hf-cache
          OUT=/workspace/omnilottie-output
          mkdir -p "$CACHE" "$HF_CACHE" "$OUT"

          cat > "$CACHE/Dockerfile" <<'DOCKERFILE'
          FROM pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          ENV DEBIAN_FRONTEND=noninteractive PIP_DISABLE_PIP_VERSION_CHECK=1
          RUN apt-get update && apt-get install -y --no-install-recommends git libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt
          RUN git clone --depth 1 https://github.com/OpenVGLab/OmniLottie.git
          WORKDIR /opt/OmniLottie
          RUN python -m pip install --no-cache-dir -r requirements.txt
          RUN python -m pip check
          RUN python - <<'PY'
          import torch, torchvision, transformers, cv2
          assert torch.__version__.startswith("2.3.0"), torch.__version__
          assert torchvision.__version__.startswith("0.18.0"), torchvision.__version__
          print("BUILD_IMPORTS_OK", torch.__version__, torchvision.__version__, transformers.__version__, cv2.__version__)
          PY
          DOCKERFILE

          echo "=== BUILD CLEAN OMNILOTTIE IMAGE ==="
          docker build --pull -t nahlaty/omnilottie:test "$CACHE"

          echo "=== GPU + IMPORT PRECHECK ==="
          docker run --rm --gpus all nahlaty/omnilottie:test python - <<'PY'
          import torch, torchvision
          print("TORCH", torch.__version__)
          print("TORCHVISION", torchvision.__version__)
          print("CUDA_BUILD", torch.version.cuda)
          print("CUDA_AVAILABLE", torch.cuda.is_available())
          assert torch.cuda.is_available()
          print("GPU", torch.cuda.get_device_name(0))
          print("VRAM_GB", round(torch.cuda.get_device_properties(0).total_memory/1024**3,1))
          PY

          echo "=== OMNILOTTIE CLI PRECHECK ==="
          docker run --rm --gpus all nahlaty/omnilottie:test python inference_hf.py --help >/tmp/omnilottie-help.txt
          grep -q -- "--model_path" /tmp/omnilottie-help.txt

          echo "=== DOWNLOAD MODEL ONCE TO PERSISTENT CACHE ==="
          docker run --rm --gpus all \
            -e HF_HOME=/hf-cache \
            -v "$HF_CACHE:/hf-cache" \
            nahlaty/omnilottie:test \
            huggingface-cli download OmniLottie/OmniLottie --local-dir /hf-cache/OmniLottie

          echo "=== FIRST REAL TEXT-TO-LOTTIE INFERENCE ==="
          rm -f "$OUT/smoke.json"
          docker run --rm --gpus all \
            -e HF_HOME=/hf-cache \
            -v "$HF_CACHE:/hf-cache" \
            -v "$OUT:/output" \
            nahlaty/omnilottie:test \
            python inference_hf.py \
              --model_path /hf-cache/OmniLottie \
              --text "A red ball gently pulses once, moves upward, then returns to its starting position in a seamless loop" \
              --output /output/smoke.json

          echo "=== VALIDATE REAL LOTTIE JSON ==="
          docker run --rm -v "$OUT:/output" nahlaty/omnilottie:test python - <<'PY'
          import json, os
          p="/output/smoke.json"
          assert os.path.isfile(p) and os.path.getsize(p)>100, "missing/empty Lottie output"
          with open(p, encoding="utf-8") as f: d=json.load(f)
          assert isinstance(d, dict)
          assert isinstance(d.get("layers"), list) and d["layers"], "no Lottie layers"
          print("LOTTIE_OK")
          print("SIZE_BYTES", os.path.getsize(p))
          print("LAYERS", len(d["layers"]))
          print("VERSION", d.get("v"))
          print("FRAMES", d.get("ip"), d.get("op"), "FPS", d.get("fr"))
          PY
          echo "OMNILOTTIE_REAL_INFERENCE_OK"
          REMOTE
