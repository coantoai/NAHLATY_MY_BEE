name: Lium B200 Preflight

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Lium pod SSH host"
        required: true
        type: string
      port:
        description: "Lium pod SSH port"
        required: true
        type: string
        default: "20300"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          LIUM_SSH_PRIVATE_KEY: ${{ secrets.LIUM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIUM_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh

          # The repository secret currently contains base64 of the raw OpenSSH
          # private-key payload (it starts with the decoded bytes "openssh-key-v1").
          # Convert it to the standard armored OpenSSH private-key format.
          KEY_B64="$(printf '%s' "$LIUM_SSH_PRIVATE_KEY" | tr -d '[:space:]')"
          printf '%s' "$KEY_B64" | base64 --decode > /tmp/lium_key_raw

          if ! head -c 14 /tmp/lium_key_raw | grep -qx 'openssh-key-v1'; then
            echo "ERROR: LIUM_SSH_PRIVATE_KEY is not base64-encoded OpenSSH private-key data."
            exit 2
          fi

          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            base64 -w 0 /tmp/lium_key_raw
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/lium_nahlaty

          chmod 600 ~/.ssh/lium_nahlaty
          ssh-keygen -y -f ~/.ssh/lium_nahlaty >/dev/null
          echo "PRIVATE_KEY_OK"

      - name: Test new Lium pod
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/lium_nahlaty -p "$PORT" root@"$HOST" '
            set -e
            echo SSH_OK
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
            python3 --version
            df -h /
          '
          echo "LIUM_B200_PREFLIGHT_OK"
