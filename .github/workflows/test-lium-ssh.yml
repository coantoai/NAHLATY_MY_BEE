name: Test Lium SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          LIUM_SSH_PRIVATE_KEY: ${{ secrets.LIUM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIUM_SSH_PRIVATE_KEY" > ~/.ssh/lium_nahlaty
          chmod 600 ~/.ssh/lium_nahlaty
          ssh-keyscan -p 20300 -H 150.136.88.209 >> ~/.ssh/known_hosts

      - name: Test Lium B200 connection
        shell: bash
        run: |
          ssh -i ~/.ssh/lium_nahlaty -p 20300 root@150.136.88.209 'echo SSH_OK && nvidia-smi'
