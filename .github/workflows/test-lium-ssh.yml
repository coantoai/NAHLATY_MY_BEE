name: Lium B200 Preflight

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Lium pod SSH host"
        required: true
        type: string
      port:
        description: "Lium pod SSH port"
        required: true
        type: string
        default: "20300"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          LIUM_SSH_PRIVATE_KEY: ${{ secrets.LIUM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIUM_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh

          # Normalize common secret-paste issues without exposing the key.
          KEY="$LIUM_SSH_PRIVATE_KEY"
          if [[ "$KEY" == *'\n'* ]]; then
            KEY="${KEY//\\n/$'\n'}"
          fi
          printf '%s' "$KEY" | tr -d '\r' > ~/.ssh/lium_nahlaty
          chmod 600 ~/.ssh/lium_nahlaty

          # Diagnose the secret format without printing its contents.
          first_line="$(head -n 1 ~/.ssh/lium_nahlaty)"
          if [[ "$first_line" == SHA256:* ]]; then
            echo "ERROR: LIUM_SSH_PRIVATE_KEY contains an SSH fingerprint (SHA256:...), not a private key."
            exit 2
          fi
          if [[ "$first_line" == ssh-* ]]; then
            echo "ERROR: LIUM_SSH_PRIVATE_KEY contains a public SSH key, not a private key."
            exit 2
          fi
          if [[ "$first_line" != "-----BEGIN "*" PRIVATE KEY-----" ]]; then
            echo "ERROR: LIUM_SSH_PRIVATE_KEY does not start with a recognized private-key header."
            echo "Detected first-line format: ${first_line:0:24}"
            exit 2
          fi

          ssh-keygen -y -f ~/.ssh/lium_nahlaty >/dev/null
          echo "PRIVATE_KEY_OK"

      - name: Test new Lium pod
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/lium_nahlaty -p "$PORT" root@"$HOST" '
            set -e
            echo SSH_OK
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
            python3 --version
            df -h /
          '
          echo "LIUM_B200_PREFLIGHT_OK"
