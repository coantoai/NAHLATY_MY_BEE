name: Build Ijiri Heart Web Pilot Asset

on:
  push:
    branches:
      - static-visual-explainer-mvp
    paths:
      - "scripts/acquire_ijiri_heart.py"
      - "scripts/prepare_ijiri_heart_web.py"
      - ".github/workflows/build-ijiri-heart-web.yml"
  workflow_dispatch:

jobs:
  build-heart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: static-visual-explainer-mvp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mesh tooling
        run: python -m pip install --disable-pip-version-check trimesh numpy scipy networkx

      - name: Acquire verified public-domain heart model
        run: python scripts/acquire_ijiri_heart.py

      - name: Prepare GLB for web pilot
        run: python scripts/prepare_ijiri_heart_web.py

      - name: Commit generated pilot asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/heart/ijiri-heart-v4.glb public/assets/heart/ijiri-heart-v4.provenance.json
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "Add inspected public-domain heart pilot asset"
            git push origin HEAD:static-visual-explainer-mvp
          fi
