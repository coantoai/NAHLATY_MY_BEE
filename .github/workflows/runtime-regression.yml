name: Runtime Regression Guard

on:
  push:
    branches:
      - test/runtime-regression-guard-20261007
  pull_request:
    paths:
      - "app/lib/visualSceneCompiler.js"
      - "tests/runtime-regression-guard.test.mjs"
      - "tests/*.test.mjs"
      - "package.json"
      - ".github/workflows/runtime-regression.yml"
  workflow_dispatch:

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
