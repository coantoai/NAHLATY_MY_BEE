name: NAHLATY Mechanical Factory CI

on:
  push:
    branches:
      - factory/mechanical-v1
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/mechanical-factory.test.mjs
