name: My Bee CI

on:
  push:
    branches:
      - visual-engine-proof-v1
      - living-visual-engine-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-bee-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Test and production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Production-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3010 npm start > /tmp/nahlaty-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3010/ >/dev/null; then break; fi
            sleep 1
          done
          NAHLATY_SMOKE_BASE=http://127.0.0.1:3010 node scripts/smoke-prod.mjs
          HEART_QA_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python scripts/qa-heart-science.py --url http://127.0.0.1:3010 --chromium "$HEART_QA_CHROMIUM" --output /tmp/nahlaty-heart-browser-evidence
          python scripts/qa-heart-entrypoints.py --url http://127.0.0.1:3010 --chromium "$HEART_QA_CHROMIUM" --output /tmp/nahlaty-heart-browser-evidence/entrypoints
      - name: Upload scientific browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-science-browser-evidence
          path: /tmp/nahlaty-heart-browser-evidence
          if-no-files-found: ignore
