name: My Bee CI

on:
  push:
    branches:
      - visual-engine-proof-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-bee-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and production build
        run: npm run build
