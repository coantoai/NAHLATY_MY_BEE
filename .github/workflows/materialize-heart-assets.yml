          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/9fd6d252-8c55-4b27-9c2e-40c58dad5a6e/2ce1661d-bf3a-479b-a4d9-ed2110ee49b3/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjhkNWIyNTIxNmQxZWUxYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwODY1OH0.kyomkWx78oNNa8BOxX7rVUWRrTQttc4YXwil1VB975c' -o public/heart-cinematic/heart-06.png
