name: Materialize Heart Cinematic Assets

on:
  workflow_dispatch:
  push:
    branches:
      - visual-engine-proof-v1
    paths:
      - .github/workflows/materialize-heart-assets.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-engine-proof-v1
          fetch-depth: 0
      - name: Skip when assets already exist
        id: existing
        run: |
          if [ -s public/heart-cinematic/heart-01.png ] && [ -s public/heart-cinematic/heart-10.png ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download approved heart scenes
        if: steps.existing.outputs.ready != 'true'
        run: |
          set -euo pipefail
          mkdir -p public/heart-cinematic
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/5fe9ea29-8f8d-4c7d-aefd-fd65d28fbe1b/4a954350-cb6d-421d-bd87-7162686ce8fe/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDIzYTA0ZGU5NGQ0ZmFiYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQxMjc2Nn0.8qnJQThjFfE-hAeR8v9ywwivohfmn2DiSpX8BvrRCT4' -o public/heart-cinematic/heart-01.png
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/d4966826-70f6-4b4e-aa24-301080443674/cd6c927c-ca7f-42b0-b32e-41baf675c76d/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjUzNDFhMDZkZGFkNjI5ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ4NTEyNn0.KtFB8fDQlHu9LJRbhWqKrwfmOBjJ5Avf5j-NZiI69jc' -o public/heart-cinematic/heart-02.png
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/80d4a605-df12-4c0b-8808-c5ca4e582d9b/6d7d155f-aec0-4128-bc32-e97e7b247b34/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTdlZWQwM2ZhODBmNTUzNCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwOTE1MX0.ccTh31j-aLnhWZ4XdahmJ87jorvj4XDF66QDKz5XQcc' -o public/heart-cinematic/heart-03.png
