          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/311b968b-8181-41f9-b388-d553c92ee248/08eafd1e-d365-46d6-9148-858c97696596/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjI3MmVhMjdiNTMyMjFkMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ1ODkxOX0.QdN_hl70_xHKdnHdcE2bKfee7dZT6zwEiu2uVOIMDbY' -o public/heart-cinematic/heart-08.png
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/30112d47-5011-402c-8e52-0dab0880a97c/edb5b30a-84e6-4d8b-950d-0844f8d41a81/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDU4NWQyZWE5ZjBiMDdmYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQxNjM2Mn0.aIt5SbMaugOgxhXxQpTgWUfFxbH3_xV2nXJDDzpvue0' -o public/heart-cinematic/heart-09.png
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/7aa9da5a-65c1-457f-87a4-d13fd608aae2/da238478-d99b-4885-8580-e771341caa66/Match_the_exact_cinematic_medical_visual_language_of__refere.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmQyMTQ0NjU5MDYzY2Q4OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ2Mzg0NX0.QkwxeEKx5auQyXeTcUCZUnEBa2OChTnfLkJE7Isik8Q' -o public/heart-cinematic/heart-10.png
          for f in public/heart-cinematic/heart-*.png; do
            test "$(stat -c%s "$f")" -gt 20000
            file "$f" | grep -qi "PNG image"
          done
      - name: Commit permanent assets
        if: steps.existing.outputs.ready != 'true'
        run: |
          git config user.name "nahlaty-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/heart-cinematic/heart-*.png
          git commit -m "Materialize approved heart cinematic assets"
          git push origin HEAD:visual-engine-proof-v1
